
name: Build nRF52840 DK Firmware

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BOARD: nrf52840dk/nrf52840
  SDK_IMAGE: nordicplayground/nrfconnect-sdk:v2.9-branch

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout application source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build using nRF Connect SDK
      - name: Build firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workdir/project" \
            "${{ env.SDK_IMAGE }}" \
            west build \
              -p always \
              -b "${{ env.BOARD }}" \
              /workdir/project \
              --build-dir /workdir/project/build
      - name: Locate generated firmware
        run: |
          echo "Searching for firmware files..."
          find build -type f \( \
            -name "*.hex" -o \
            -name "*.bin" -o \
            -name "*.elf" \
          \) -print

      # 3. Verify build output
      - name: Check firmware files
        run: |
          ls -lh build/project/zephyr/
          test -f build/project/zephyr/zephyr.hex
          test -f build/project/zephyr/zephyr.bin
          test -f build/project/zephyr/zephyr.elf

      # 4. Upload compiled firmware
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840dk-firmware
          path: |
            build/project/zephyr/zephyr.hex
            build/project/zephyr/zephyr.bin
            build/project/zephyr/zephyr.elf
            build/project/zephyr/zephyr.map
          if-no-files-found: error
          retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ github.sha }}
          name: Nightly Build ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.hex
            artifacts/**/*.bin
            artifacts/**/*.elf
            artifacts/**/*.map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
