
name: Build nRF52840 DK Firmware

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BOARD: nrf52840dk/nrf52840
  SDK_IMAGE: nordicplayground/nrfconnect-sdk:v2.9-branch

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout application source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build using nRF Connect SDK
      - name: Build firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workdir/project" \
            "${{ env.SDK_IMAGE }}" \
            west build \
              -p always \
              -b "${{ env.BOARD }}" \
              /workdir/project \
              --build-dir /workdir/project/build
      - name: Locate generated firmware
        run: |
          echo "Searching for firmware files..."
          find build -type f \( \
            -name "*.hex" -o \
            -name "*.bin" -o \
            -name "*.elf" \
          \) -print

      # 3. Verify build output
      - name: Check firmware files
        run: |
          ls -lh build/project/zephyr/
          test -f build/project/zephyr/zephyr.hex
          test -f build/project/zephyr/zephyr.bin
          test -f build/project/zephyr/zephyr.elf

      # 4. Upload compiled firmware
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840dk-firmware
          path: |
            build/project/zephyr/zephyr.hex
            build/project/zephyr/zephyr.bin
            build/project/zephyr/zephyr.elf
            build/project/zephyr/zephyr.map
          if-no-files-found: error
          retention-days: 30
          
      # 5. Generate unique version tag
      - name: Generate release version
        if: github.event_name != 'pull_request'
        id: version
        run: |
          TAG="v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG"

      # 6. Create and push Git tag
      - name: Create Git tag
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$RELEASE_TAG" \
            -m "Firmware release $RELEASE_TAG"

          git push origin "$RELEASE_TAG"

      # 7. Create GitHub Release
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "nRF52840 DK $RELEASE_TAG" \
            --generate-notes \
            --verify-tag

      # 8. Upload firmware to Release
      - name: Upload Release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" firmware/*
