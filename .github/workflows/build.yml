name: Build nRF52840 firmware

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BOARD: nrf52840dk/nrf52840
  NCS_VERSION: v2.9.0

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:7e9b61475ca05b8517079bedc8645479101fdaa17de2d0fa06a1633288112db2

    defaults:
      run:
        shell: bash

    outputs:
      firmware_version: ${{ steps.version.outputs.firmware_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags, so describe-style versioning works

      - name: Trust workspace for git
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Fail early if the hash still can't be read
          git -C "$GITHUB_WORKSPACE" rev-parse --short=12 HEAD

      - name: Verify toolchain
        run: |
          set -euo pipefail
          west --version
          arm-zephyr-eabi-gcc --version

      # - name: Initialize SDK and build firmware
      #   run: |
      #     set -euo pipefail

      #     # Initialize the SDK workspace at the requested revision.
      #     west init \
      #       -m https://github.com/nrfconnect/sdk-nrf \
      #       --mr "$NCS_VERSION" \
      #       /tmp/ncs

      #     cd /tmp/ncs

      #     # Fetch the SDK repositories specified by the manifest.
      #     west update

      #     # Verify repository revisions.
      #     echo "=== NCS revision ==="
      #     git -C nrf rev-parse HEAD

      #     echo "=== Zephyr revision ==="
      #     git -C zephyr rev-parse HEAD

      #     echo "=== All SDK repository revisions ==="
      #     west list -f "{name}: {sha}"

      #     # Build the application.
      #     west build \
      #       -p always \
      #       -b "$BOARD" \
      #       -s "$GITHUB_WORKSPACE" \
      #       -d "$GITHUB_WORKSPACE/build" \
      #       -- \
      #       -DNCS_TOOLCHAIN_VERSION=NONE \
      #       -DDEBUG_THREAD_INFO=On \
      #       -DCONFIG_DEBUG_THREAD_INFO=y \
      #       -Dnrf52840-ci_DEBUG_THREAD_INFO=On

      - name: Initialize SDK and build firmware
        run: |
          set -euo pipefail

          # Initialize the SDK workspace at the requested revision.
          west init \
            -m https://github.com/nrfconnect/sdk-nrf \
            --mr "$NCS_VERSION" \
            /tmp/ncs

          cd /tmp/ncs

          # Fetch the SDK repositories specified by the manifest.
          west update

          # Verify repository revisions.
          echo "=== NCS revision ==="
          git -C nrf rev-parse HEAD

          echo "=== Zephyr revision ==="
          git -C zephyr rev-parse HEAD

          echo "=== All SDK repository revisions ==="
          west list -f "{name}: {sha}"

          # Build the application.
          python3 "$GITHUB_WORKSPACE/scripts/build_firmware.py"

      - name: Check firmware files
        run: |
          set -euo pipefail

          echo "Build directory: $BUILD_DIR"
          ls -lh "$BUILD_DIR"

          test -f "$BUILD_DIR/merged.hex"
          test -f "$BUILD_DIR/${{ github.event.repository.name }}/zephyr/zephyr.hex"
          test -f "$BUILD_DIR/${{ github.event.repository.name }}/zephyr/zephyr.bin"
          test -f "$BUILD_DIR/${{ github.event.repository.name }}/zephyr/zephyr.elf"
          test -f "$BUILD_DIR/${{ github.event.repository.name }}/zephyr/zephyr.map"

      - name: Get firmware version
        id: version
        run: |
          set -euo pipefail

          VERSION_MAJOR=$(awk -F '=' '/^VERSION_MAJOR/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)
          VERSION_MINOR=$(awk -F '=' '/^VERSION_MINOR/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)
          PATCHLEVEL=$(awk -F '=' '/^PATCHLEVEL/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)
          VERSION_TWEAK=$(awk -F '=' '/^VERSION_TWEAK/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)

          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${PATCHLEVEL}+${VERSION_TWEAK}"

          echo "Firmware version: $VERSION"
          echo "firmware_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-firmware
          path: |
            ${{ env.BUILD_DIR }}/merged.hex
            ${{ env.BUILD_DIR }}/dfu_application.zip
            ${{ env.BUILD_DIR }}/${{ github.event.repository.name }}/zephyr/zephyr.hex
            ${{ env.BUILD_DIR }}/${{ github.event.repository.name }}/zephyr/zephyr.bin
            ${{ env.BUILD_DIR }}/${{ github.event.repository.name }}/zephyr/zephyr.elf
            ${{ env.BUILD_DIR }}/${{ github.event.repository.name }}/zephyr/zephyr.map
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: nrf52840-firmware
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Extract and rename signed DFU firmware
        run: |
          set -euo pipefail

          PROJECT_NAME="${{ github.event.repository.name }}"
          VERSION="${{ needs.build.outputs.firmware_version }}"

          ZIP_FILE="artifacts/dfu_application.zip"
          SIGNED_BIN="${PROJECT_NAME}.signed.bin"
          RELEASE_BIN="${PROJECT_NAME}-v${VERSION}.signed.bin"

          if [[ -f "$ZIP_FILE" ]]; then
            echo "DFU ZIP found: $ZIP_FILE"

            # Extract only the signed binary into the artifacts directory
            unzip -j "$ZIP_FILE" "$SIGNED_BIN" -d artifacts/

            # Rename the extracted firmware
            mv "artifacts/$SIGNED_BIN" "artifacts/$RELEASE_BIN"

            echo "Signed firmware prepared: $RELEASE_BIN"
          else
            echo "No DFU ZIP found. Skipping signed firmware extraction."
          fi

      - name: Rename firmware files
        run: |
          set -euo pipefail

          VERSION="${{ needs.build.outputs.firmware_version }}"
          PROJECT_NAME="${{ github.event.repository.name }}"
          RELEASE_NAME="nrf52840-firmware-v${VERSION}"

          # Rename merged firmware
          mv "artifacts/merged.hex" \
             "artifacts/${RELEASE_NAME}.hex"

          echo "=== Release files ==="
          ls -lh artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.firmware_version }}
          name: Release v${{ needs.build.outputs.firmware_version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*.hex
            artifacts/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

