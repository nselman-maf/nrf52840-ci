name: Build nRF52840 DK Firmware

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BOARD: nrf52840dk/nrf52840
  NCS_VERSION: v2.9.0

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:7e9b61475ca05b8517079bedc8645479101fdaa17de2d0fa06a1633288112db2

    defaults:
      run:
        shell: bash

    outputs:
      firmware_version: ${{ steps.version.outputs.firmware_version }}

    steps:
      # 1. Checkout application source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify toolchain
      - name: Verify toolchain
        run: |
          set -euo pipefail
          west --version
          arm-zephyr-eabi-gcc --version

      # 3. Initialize SDK and build firmware
      - name: Build firmware
        run: |
          set -euo pipefail

          # Initialize the SDK workspace at the requested revision.
          west init \
            -m https://github.com/nrfconnect/sdk-nrf \
            --mr "$NCS_VERSION" \
            /tmp/ncs

          cd /tmp/ncs

          # Fetch the SDK repositories specified by the manifest.
          west update

          # Verify repository revisions.
          echo "=== NCS revision ==="
          git -C nrf rev-parse HEAD

          echo "=== Zephyr revision ==="
          git -C zephyr rev-parse HEAD

          echo "=== All SDK repository revisions ==="
          west list -f "{name}: {sha}"

          # Build the application.
          west build \
            -p always \
            -b "$BOARD" \
            -s "$GITHUB_WORKSPACE" \
            -d "$GITHUB_WORKSPACE/build/project" \
            -- \
            -DNCS_TOOLCHAIN_VERSION=NONE \
            -DCONFIG_DEBUG_THREAD_INFO=y

      # 4. Locate generated firmware
      - name: Locate generated firmware
        run: |
          echo "Searching for firmware files..."
          find build/project -type f \( \
            -name "*.hex" -o \
            -name "*.bin" -o \
            -name "*.elf" -o \
            -name "*.map" \
          \) -print

      # 5. Verify build output
      - name: Check firmware files
        run: |
          set -euo pipefail

          ls -lh build/project/zephyr/

          test -f build/project/zephyr/zephyr.hex
          test -f build/project/zephyr/zephyr.bin
          test -f build/project/zephyr/zephyr.elf
          test -f build/project/zephyr/zephyr.map

      # 6. Extract firmware version
      - name: Get firmware version
        id: version
        run: |
          set -euo pipefail

          VERSION_MAJOR=$(awk -F '=' '/^VERSION_MAJOR/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)
          VERSION_MINOR=$(awk -F '=' '/^VERSION_MINOR/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)
          PATCHLEVEL=$(awk -F '=' '/^PATCHLEVEL/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)
          VERSION_TWEAK=$(awk -F '=' '/^VERSION_TWEAK/ {gsub(/[[:space:]]/, "", $2); print $2}' VERSION)

          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${PATCHLEVEL}+${VERSION_TWEAK}"

          echo "Firmware version: $VERSION"
          echo "firmware_version=$VERSION" >> "$GITHUB_OUTPUT"

      # 7. Upload compiled firmware
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840dk-firmware
          path: |
            build/project/zephyr/zephyr.hex
            build/project/zephyr/zephyr.bin
            build/project/zephyr/zephyr.elf
            build/project/zephyr/zephyr.map
          if-no-files-found: error
          retention-days: 30

  # 8. Create a GitHub Release
  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: nrf52840dk-firmware
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.firmware_version }}
          name: Release v${{ needs.build.outputs.firmware_version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.hex
            artifacts/**/*.bin
            artifacts/**/*.elf
            artifacts/**/*.map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

